<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="心灵栖息地">
    <title>心灵栖息地 | iPad 治愈微光沙盒</title>
    <style>
        :root {
            --bg-1: #1a1c2e;
            --bg-2: #0f101d;
            --glass-bg: rgba(255, 255, 255, 0.09);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            background: radial-gradient(circle at center, var(--bg-1), var(--bg-2));
            color: var(--text-main);
            transition: background 1.5s ease;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px) 24px;
            transition: opacity 0.5s ease;
        }

        .ui-layer.hidden {
            opacity: 0;
            pointer-events: none !important;
        }

        .interactive {
            pointer-events: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .brand h1 {
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #e0e7ff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .top-controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.25);
        }

        .bottom-dock {
            align-self: center;
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 10px 20px;
            border-radius: 40px;
            display: flex;
            gap: 16px;
            align-items: center;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
        }

        .dock-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dock-divider {
            width: 1px;
            height: 22px;
            background: rgba(255,255,255,0.2);
        }

        .tool-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tool-btn.active {
            background: rgba(167, 139, 250, 0.35);
            border-color: rgba(167, 139, 250, 0.7);
            box-shadow: 0 0 18px rgba(167, 139, 250, 0.5);
        }

        /* 恢复 UI 悬浮按钮 */
        .restore-ui-pill {
            position: absolute;
            top: calc(env(safe-area-inset-top) + 20px);
            right: 24px;
            z-index: 99;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .restore-ui-pill.visible {
            opacity: 0.85;
            pointer-events: auto;
        }

        .restore-ui-pill:active {
            transform: scale(0.95);
            opacity: 1;
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            background: rgba(20, 21, 38, 0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 28px;
            width: 85%;
            max-width: 420px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal h2 { font-size: 1.25rem; margin-bottom: 8px; font-weight: 500; }
        .modal p { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px; }

        .breathing-container {
            width: 170px;
            height: 170px;
            margin: 16px auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .breathing-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.7), rgba(192, 132, 252, 0.2));
            box-shadow: 0 0 35px rgba(167, 139, 250, 0.5);
            animation: breathe 12s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.85); opacity: 0.5; }
            40% { transform: scale(1.65); opacity: 0.95; box-shadow: 0 0 55px rgba(167, 139, 250, 0.85); }
            50% { transform: scale(1.65); opacity: 0.95; }
            90% { transform: scale(0.85); opacity: 0.5; }
        }

        .breathing-text {
            position: absolute;
            font-size: 0.95rem;
            letter-spacing: 1px;
            font-weight: 500;
            color: #ffffff;
        }

        .worry-input {
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            margin-bottom: 16px;
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.3rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="sandboxCanvas"></canvas>

    <!-- 沉浸模式下的恢复按钮 -->
    <div class="restore-ui-pill" id="restoreUiPill">
        <span>👁️</span> 显示界面
    </div>

    <div class="ui-layer" id="uiLayer">
        <header class="interactive">
            <div class="brand">
                <h1>心灵栖息地</h1>
                <p>iPad 治愈系微光沙盒 · 慢下来，感受当下</p>
            </div>

            <div class="top-controls">
                <button class="btn" id="soundToggleBtn"><span id="soundIcon">🔇</span> <span id="soundText">音效</span></button>
                <button class="btn" id="themeBtn">🎨 主题</button>
                <button class="btn" id="breathModalBtn">🫁 呼吸</button>
                <button class="btn" id="worryModalBtn">✨ 解压</button>
            </div>
        </header>

        <div class="bottom-dock interactive">
            <div class="dock-group">
                <button class="tool-btn active" data-tool="stardust">🌟</button>
                <button class="tool-btn" data-tool="sakura">🌸</button>
                <button class="tool-btn" data-tool="ripple">🌊</button>
                <button class="tool-btn" data-tool="lantern">🏮</button>
            </div>
            <div class="dock-divider"></div>
            <div class="dock-group">
                <button class="tool-btn" id="clearBtn">🧹</button>
                <button class="tool-btn" id="focusModeBtn">👁️</button>
            </div>
        </div>
    </div>

    <!-- 正念呼吸弹窗 -->
    <div class="modal interactive" id="breathingModal">
        <button class="close-btn" id="closeBreathBtn">&times;</button>
        <h2>4-7-8 正念呼吸</h2>
        <p>跟随后图律动，伴随光晕散发深呼吸。</p>
        <div class="breathing-container">
            <div class="breathing-circle"></div>
            <div class="breathing-text" id="breathStateText">吸气...</div>
        </div>
    </div>

    <!-- 烦恼消解弹窗 -->
    <div class="modal interactive" id="worryModal">
        <button class="close-btn" id="closeWorryBtn">&times;</button>
        <h2>烦恼消解纸条</h2>
        <p>写下此时此刻的焦虑，点击释放，让它化作鼓励与星光散去。</p>
        <textarea class="worry-input" id="worryText" placeholder="写下困扰你的事情..."></textarea>
        <button class="btn" id="releaseWorryBtn" style="width: 100%; justify-content: center; background: rgba(167, 139, 250, 0.35);">
            ✨ 化作星光释放
        </button>
    </div>

    <script>
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 屏幕常亮支持
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }

        const themes = [
            { bg1: "#1a1c2e", bg2: "#0f101d", colors: ['#a78bfa', '#c084fc', '#818cf8', '#e0e7ff'] },
            { bg1: "#2d1f2d", bg2: "#190f1a", colors: ['#fb7185', '#f43f5e', '#fde047', '#fed7aa'] },
            { bg1: "#0f231c", bg2: "#081410", colors: ['#34d399', '#10b981', '#a7f3d0', '#6ee7b7'] },
            { bg1: "#0c2340", bg2: "#051120", colors: ['#38bdf8', '#0284c7', '#7dd3fc', '#bae6fd'] }
        ];
        let currentThemeIndex = 0;

        let currentTool = 'stardust';
        let particles = [];
        let ripples = [];
        let lanterns = [];
        let floatingMessages = [];

        const praiseQuotes = [
            "允许自己休息一下，你已经做得非常棒啦 ✨",
            "所有的烦恼，都会像星光一样慢慢散去 🌸",
            "别担心，一切都在按照最好的节奏发生 🌙",
            "抱抱你，今天的你也辛苦了 ☀️",
            "你比自己想象的要坚强且温柔得多 💫",
            "把不开心留给风，明天又是美好的一天 🍃",
            "给自己一点时间，允许花朵慢慢盛开 🌸"
        ];

        let audioCtx = null;
        let isSoundEnabled = false;

        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        const notes = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

        function playHarmonicTone(freq, duration = 1.6) {
            if (!isSoundEnabled || !audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.08);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function playRandomNote() {
            playHarmonicTone(notes[Math.floor(Math.random() * notes.length)]);
        }

        class Particle {
            constructor(x, y, color, pressure = 0.5, type = 'stardust') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.size = (Math.random() * 4 + 2) * (pressure + 0.5);
                this.life = 1.0;

                if (type === 'stardust') {
                    this.vx = (Math.random() - 0.5) * 1.6;
                    this.vy = (Math.random() - 0.5) * 1.6 - 0.4;
                    this.decay = Math.random() * 0.008 + 0.004;
                } else if (type === 'sakura') {
                    this.vx = Math.random() * 1.2 - 0.6;
                    this.vy = Math.random() * 1.4 + 0.8;
                    this.angle = Math.random() * Math.PI * 2;
                    this.angularVelocity = (Math.random() - 0.5) * 0.02;
                    this.decay = Math.random() * 0.003 + 0.002;
                    this.size = (Math.random() * 6 + 4) * (pressure + 0.5);
                } else if (type === 'breath_pulse') {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 2.5 + 1.2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.decay = Math.random() * 0.006 + 0.003;
                    this.size = Math.random() * 3.5 + 2;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.type === 'sakura') this.angle += this.angularVelocity;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                if (this.type === 'stardust' || this.type === 'breath_pulse') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                } else if (this.type === 'sakura') {
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.size, this.size * 0.5, 0, 0, Math.PI * 2);
                    ctx.fillStyle = "#f472b6";
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = "#fb7185";
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Ripple {
            constructor(x, y, color, pressure = 0.5) {
                this.x = x;
                this.y = y;
                this.radius = 2;
                this.maxRadius = (Math.random() * 80 + 60) * (pressure + 0.5);
                this.color = color;
                this.opacity = 0.8;
            }

            update() {
                this.radius += 2.0;
                this.opacity -= 0.012;
            }

            draw() {
                if (this.opacity <= 0) return;
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.lineWidth = 2.0;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.stroke();
                ctx.restore();
            }
        }

        class Lantern {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = - (Math.random() * 0.8 + 0.6);
                this.size = Math.random() * 12 + 16;
                this.opacity = 0.9;
            }

            update() {
                this.y += this.vy;
                this.x += Math.sin(this.y * 0.01) * 0.4;
                if (this.y < -50) this.opacity = 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = "rgba(251, 146, 60, 0.85)";
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#f97316";
                ctx.beginPath();
                ctx.roundRect(this.x - this.size/2, this.y - this.size/1.5, this.size, this.size * 1.3, 6);
                ctx.fill();
                ctx.fillStyle = "#fef08a";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.25, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingPraise {
            constructor(text, x, y) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.vy = -0.6;
                this.life = 1.0;
                this.decay = 0.005;
            }

            update() {
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.font = "500 1.15rem -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif";
                ctx.textAlign = "center";
                ctx.fillStyle = "#fde047";
                ctx.shadowBlur = 16;
                ctx.shadowColor = "rgba(253, 224, 71, 0.8)";
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        function spawnEffect(x, y, pressure = 0.5) {
            const activeColors = themes[currentThemeIndex].colors;
            const color = activeColors[Math.floor(Math.random() * activeColors.length)];

            if (currentTool === 'stardust') {
                for (let i = 0; i < 3; i++) particles.push(new Particle(x, y, color, pressure, 'stardust'));
            } else if (currentTool === 'sakura') {
                for (let i = 0; i < 2; i++) particles.push(new Particle(x + (Math.random()-0.5)*20, y + (Math.random()-0.5)*20, color, pressure, 'sakura'));
            } else if (currentTool === 'ripple') {
                ripples.push(new Ripple(x, y, color, pressure));
                playRandomNote();
            } else if (currentTool === 'lantern') {
                lanterns.push(new Lantern(x, y));
                playRandomNote();
            }
        }

        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('.interactive') || e.target.closest('#restoreUiPill')) return;
            if (isFocusMode) {
                restoreUi();
                return;
            }
            initAudio();
            requestWakeLock();
            spawnEffect(e.clientX, e.clientY, e.pressure || 0.5);
        });

        window.addEventListener('pointermove', (e) => {
            if (isFocusMode) return;
            if (e.buttons !== 1 && e.pointerType !== 'touch') return;
            if (e.target.closest('.interactive')) return;
            spawnEffect(e.clientX, e.clientY, e.pressure || 0.5);
            if (Math.random() < 0.15) playRandomNote();
        });

        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTool = btn.getAttribute('data-tool');
            });
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            particles = []; ripples = []; lanterns = []; floatingMessages = [];
        });

        document.getElementById('themeBtn').addEventListener('click', () => {
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            const theme = themes[currentThemeIndex];
            document.body.style.background = `radial-gradient(circle at center, ${theme.bg1}, ${theme.bg2})`;
            playRandomNote();
        });

        const soundBtn = document.getElementById('soundToggleBtn');
        soundBtn.addEventListener('click', () => {
            initAudio();
            isSoundEnabled = !isSoundEnabled;
            document.getElementById('soundIcon').textContent = isSoundEnabled ? '🔊' : '🔇';
            if (isSoundEnabled) playRandomNote();
        });

        const uiLayer = document.getElementById('uiLayer');
        const restorePill = document.getElementById('restoreUiPill');
        let isFocusMode = false;

        function hideUi() {
            isFocusMode = true;
            uiLayer.classList.add('hidden');
            restorePill.classList.add('visible');
        }

        function restoreUi() {
            isFocusMode = false;
            uiLayer.classList.remove('hidden');
            restorePill.classList.remove('visible');
        }

        document.getElementById('focusModeBtn').addEventListener('click', hideUi);
        restorePill.addEventListener('click', restoreUi);

        const breathModal = document.getElementById('breathingModal');
        const breathText = document.getElementById('breathStateText');
        let breathInterval = null;

        document.getElementById('breathModalBtn').addEventListener('click', () => {
            breathModal.classList.add('active');
            
            if (!breathInterval) {
                breathInterval = setInterval(() => {
                    if (breathModal.classList.contains('active')) {
                        const cx = width / 2;
                        const cy = height / 2;
                        const activeColors = themes[currentThemeIndex].colors;
                        
                        for (let i = 0; i < 18; i++) {
                            const color = activeColors[i % activeColors.length];
                            particles.push(new Particle(cx, cy, color, 0.8, 'breath_pulse'));
                        }
                        ripples.push(new Ripple(cx, cy, activeColors[0], 0.9));
                        playRandomNote();
                    }
                }, 900);
            }
        });

        document.getElementById('closeBreathBtn').addEventListener('click', () => {
            breathModal.classList.remove('active');
            if (breathInterval) {
                clearInterval(breathInterval);
                breathInterval = null;
            }
        });

        setInterval(() => {
            if (breathModal.classList.contains('active')) {
                const cycleTime = (Date.now() % 12000) / 1000;
                if (cycleTime < 4.8) breathText.textContent = "吸气 Inhale...";
                else if (cycleTime < 6.0) breathText.textContent = "保持 Hold...";
                else breathText.textContent = "呼气 Exhale...";
            }
        }, 500);

        const worryModal = document.getElementById('worryModal');
        document.getElementById('worryModalBtn').addEventListener('click', () => worryModal.classList.add('active'));
        document.getElementById('closeWorryBtn').addEventListener('click', () => worryModal.classList.remove('active'));

        document.getElementById('releaseWorryBtn').addEventListener('click', () => {
            const input = document.getElementById('worryText');
            if (input.value.trim() !== '') {
                const cx = width / 2;
                const cy = height / 2;

                const randomPraise = praiseQuotes[Math.floor(Math.random() * praiseQuotes.length)];
                floatingMessages.push(new FloatingPraise(randomPraise, cx, cy - 40));

                for (let i = 0; i < 70; i++) {
                    const p = new Particle(cx + (Math.random()-0.5)*140, cy + (Math.random()-0.5)*140, '#fde047', 0.8, 'stardust');
                    p.vx *= 3.5; p.vy *= 3.5;
                    particles.push(p);
                }

                playRandomNote();
                input.value = '';
                worryModal.classList.remove('active');
            }
        });

        function render() {
            ctx.clearRect(0, 0, width, height);

            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].opacity <= 0) ripples.splice(i, 1);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            for (let i = lanterns.length - 1; i >= 0; i--) {
                lanterns[i].update();
                lanterns[i].draw();
                if (lanterns[i].opacity <= 0) lanterns.splice(i, 1);
            }

            for (let i = floatingMessages.length - 1; i >= 0; i--) {
                floatingMessages[i].update();
                floatingMessages[i].draw();
                if (floatingMessages[i].life <= 0) floatingMessages.splice(i, 1);
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
